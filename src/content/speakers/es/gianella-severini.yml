id: gianella-severini
name: Gianella Severini
avatar: ../../../assets/team/gianella_severini.jpg
bio: >
  Abogada y periodista argentina especializada en políticas de salud pública. Es coordinadora jurídica para América Latina en Tobacco-Free Kids, donde presta asistencia jurídica técnica para promover políticas de control del tabaco en la región.
  Cuenta con una amplia experiencia en normativa sobre enfermedades no transmisibles, lo que incluye el desarrollo de políticas, la redacción de textos jurídicos, la estrategia procesal y las iniciativas de desarrollo de capacidades. Anteriormente trabajó en el Instituto O’Neill de Derecho Sanitario Nacional y Global, la Fundación Interamericana del Corazón de Argentina y la Fundación para el Desarrollo de Políticas Sostenibles.
  Galardonada con el Premio del Director General de la OMS 2024, cuenta con un máster en Derecho Sanitario Global por la Universidad de Georgetown y un máster en Democracia Global y Estado de Derecho por la Universidad de Génova.
role: Ponentes Magistrales
company: Campaign for Tobacco Free Kids