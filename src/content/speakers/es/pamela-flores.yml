id: pamela-flores
name: Pamela Flores Subias
avatar: ../../../assets/card.png
bio: >
  Pamela Flores Subias es investigadora (fellow) en el Centro para la Salud y Derechos Humanos del Instituto O’Neill para el Derecho a la Salud Nacional y Global, de la Universidad de Georgetown (Washington D.C.). Su trabajo se enfoca en el análisis comparado, la regulación, reforma y financiamiento de sistemas de salud, así como en políticas públicas en torno a enfermedades no transmisibles (ENT), incluyendo aquellas enfocadas en la alimentación poco saludable y el tabaco.
  Ha realizado consultorías con el Banco Mundial en México y colaboraciones con distintas organizaciones de la sociedad civil, universidades y centros de investigación, como la Universidad Iberoamericana y el Instituto Nacional de Salud Pública. Anteriormente, coordinó el Programa de Derecho y Salud Pública del Instituto Tecnológico Autónomo de México, donde lideró proyectos de investigación y consultoría sobre derecho a la salud, políticas públicas y prevención de ENT. 
  Es abogada por el Instituto Tecnológico Autónomo de México y cuenta con una Maestría en Derecho (LL.M.) en Salud Nacional y Global por la Universidad de Georgetown, junto con un Certificado en Derechos Humanos.
role: Mentora
company: Centro para la Salud y los Derechos Humanos del Instituto O’Neill 