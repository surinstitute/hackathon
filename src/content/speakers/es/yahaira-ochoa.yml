id: yahaira-ochoa
name: Yahaira Ochoa
avatar: ../../../assets/card.png
bio: >
  Socia fundadora de Salud Justa Mx de la cual actualmente es coordinadora de comunicación y fundadora de la Red de Mujeres por la Salud (REMUSA).
  Maestra en Políticas Públicas y Género por la Facultad Latinoamericana de Ciencias Sociales México (FLACSO), cuenta con una Licenciatura en Ciencias de la Comunicación por la Universidad Nacional Autónoma de México (UNAM) y, una especialidad en El Género de la Economía de la misma casa de estudios. Ha tomado talleres y diplomados sobre comunicación, género, políticas públicas con enfoque en salud pública. 
  Activista por la defensa del derecho a la salud desde hace 15 años, ha participado en eventos nacionales e internacionales compartiendo su experiencia desde la sociedad civil impulsando campañas de comunicación.
role: Mentorías especializadas
company: Salud Justa MX
