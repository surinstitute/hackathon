id: maria-ponciano
name: María Ponciano
avatar: ../../../assets/card.png
bio: >
  Profesora de tiempo completo del Departamento de Salud Pública de la Facultad de Medicina de la Universidad Nacional Autónoma de México (UNAM), con trayectoria en la prevención y el tratamiento del tabaquismo y otras adicciones, así como en salud ambiental. Su trabajo integra la atención clínica, la investigación, la docencia y la formación de recursos humanos. Ha publicado 98 artículos de investigación en revistas nacionales e internacionales indexadas y ha participado en el desarrollo de estrategias educativas y lineamientos para la atención del consumo de tabaco.
  Ha estado al frente de la Clínica para Tratamiento del Tabaquismo de la facultad de Medicina de la UNAM durante 26 años ininterrumpidos.
role: Ponentes Magistrales
company: Universidad Nacional Autónoma de México (UNAM)