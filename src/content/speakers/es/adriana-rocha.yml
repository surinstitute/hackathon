id: adriana-rocha
name: Adriana Rocha
avatar: ../../../assets/card.png
bio: >
  Adriana es Directora de Proyectos con Sociedad Civil e Incidencia Legislativa en Polithink, una consultoría especializada en dar acompañamiento y asesoría a organizaciones de la sociedad civil en procesos de incidencia. Cuenta con estudios de Economía por el Instituto Tecnológico Autónomo de México (ITAM), un diploma en dirección y Administración de Organizaciones de la Sociedad Civil por la Universidad ORT y una especialidad en liderazgo en salud pública en el Instituto Global de Control de Tabaco de la Universidad de Johns Hopkins. Desde 2012, ha enfocado su trabajo en temas de salud pública, en particular Enfermedades No Transmisibles y factores riesgo. Ha liderado proyectos de incidencia legislativa en temas de movilidad y derechos animales en la Ciudad de México, y control de tabaco y obesidad a nivel nacional. Ha participado en la elaboración de reportes y evaluaciones sobre la interferencia de la industria tabacalera, así como en la identificación y denuncia de conflictos de interés. Es integrante de la Coalición México SaludHable y miembro fundadora de la Red de Mujeres por la Salud – REMUSA. 
role: Ponentes Magistrales
company: Polithink