id: gabriela-prieto
name: Gabriela Prieto Soriano
avatar: ../../../assets/team/gabriela_prieto.jpeg
bio: >
  Gabriela Prieto Soriano es doctora en Artes, profesora de asignatura “B” definitiva en
  la Facultad de Artes y Diseño de la Universidad Nacional Autónoma de México y
  docente de la Especialización en Gestión de Proyectos Museales. Cuenta con más de
  ocho años de experiencia en educación superior y una trayectoria que integra
  docencia, investigación, diseño curricular, museología y gestión cultural.
  Ha impartido asignaturas de metodología de la investigación, seminarios de proyectos,
  teoría e historia del arte y el diseño, redacción académica, análisis de la obra y
  herramientas digitales para proyectos museales. Su práctica docente vincula
  objetivos, contenidos, actividades, recursos y criterios de evaluación, con énfasis en
  la claridad metodológica, la pertinencia pedagógica y el acompañamiento estudiantil.
  Con más de 20 años de experiencia en museos, centros culturales y proyectos
  expositivos. Especialista en gestión curatorial, investigación y documentación de
  acervos, producción y montaje, logística de préstamos, mediación cultural y
  museología participativa. Ha coordinado exposiciones artísticas, científicas y
  patrimoniales de alcance nacional e internacional, articulando contenidos, públicos,
  tecnología y operación. Es miembro del Grupo de investigación en Diseño, creación y
  gestión de exposiciones “Patricia Real Fierros” de la Facultad de Artes y Diseño de la
  UNAM.
role: Mentorías especializadas
company: Universidad Nacional Autónoma de México (UNAM)
