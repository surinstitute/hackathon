name: Ariadna Tovar
avatar: ../../../assets/card.png
bio: >
  Ariadna Tovar Ramírez es Consultora Senior del Centro para la Salud y los Derechos Humanos del Instituto O’Neill para el Derecho a la Salud Nacional y Global, de la Universidad de Georgetown (Washington D.C.). Ha realizado consultorías en derechos humanos para el Secretariado Internacional de Amnistía Internacional, Fair Square y el Instituto Interamericano de Derechos Humanos, entre otras organizaciones. Antes de desempeñarse como consultora, Ariadna fue Investigadora sobre personas defensoras de derechos humanos para las Américas en el Secretariado Internacional de Amnistía Internacional. Previamente fue directora legal para la región de Women’s Link Worldwide, donde diseñó y lideró estrategias legales para el avance de los derechos sexuales y reproductivos, así como de los derechos de las mujeres y niñas sobrevivientes de trata de personas. 
  Es abogada y maestra en derecho de la Universidad de los Andes en Colombia. Cursó el Diplomado “Mujeres y Derechos Humanos: Estrategias Jurídicas para la Incidencia” de la Universidad de Chile y el Diplomado en Diplomado en “Bioética, Salud y Bioderecho” del Instituto de Investigaciones Jurídicas de la Universidad Nacional Autónoma de México.
role: Ponentes Magistrales
